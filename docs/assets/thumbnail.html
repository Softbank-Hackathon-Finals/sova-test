<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><title>Sova · 실제 온프렘 검증</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: linear-gradient(120deg, #f7faff, #edf2ff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #21385e;
    }
    .top {
      position: absolute;
      left: 58px;
      top: 29px;
      right: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      font-size: 46px;
      font-weight: 760;
      letter-spacing: -2px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .mark {
      font-size: 33px;
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 17px;
      background: #3e6be8;
      color: #fff;
      letter-spacing: 0;
    }
    .brand em {
      font-style: normal;
      color: #3e6be8;
    }
    .caption {
      font-size: 23px;
      color: #506888;
      margin-left: 24px;
      letter-spacing: 0;
      font-weight: 600;
    }
    .badge {
      border: 1px solid #bce4d3;
      border-radius: 24px;
      background: #e8f8f0;
      padding: 10px 18px;
      color: #19744f;
      font-size: 17px;
      font-weight: 650;
    }
    .sub {
      position: absolute;
      top: 100px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      color: #7689a7;
    }
    .frame {
      position: absolute;
      top: 143px;
      left: 58px;
      right: 58px;
      height: 665px;
      border: 1px solid #dce5f5;
      border-radius: 18px;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 16px 45px #223d6b14;
      display: grid;
      place-items: center;
    }
    .frame img {
      width: 1350px;
      height: auto;
      display: block;
    }
    .footer {
      position: absolute;
      top: 830px;
      left: 60px;
      right: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #657d9e;
      font-size: 17px;
    }
    .chips {
      display: flex;
      gap: 9px;
    }
    .chips span {
      padding: 8px 13px;
      border: 1px solid #dce5f5;
      border-radius: 9px;
      background: #fff;
    }
    .note {
      font-size: 15px;
      text-align: right;
      line-height: 1.7;
    }
  </style>
  <div class="top">
    <div class="brand">
      <span class="mark">S</span><span>Sova<em>.</em></span
      ><span class="caption">실제 워크로드 격리 · 대체 · 경로 전환</span>
    </div>
    <div class="badge">실제 온프렘 클러스터 검증</div>
  </div>
  <div class="sub">
    <span>시험 워크로드의 관측 결과를 표시한 실제 UI 캡처</span
    ><span>검증일 2026.11.08 · 당시 저장 화면</span>
  </div>
  <div class="frame">
    <img
      src="workload-verified-capture.png"
      alt="실제 시험 원본 격리와 대체 API 경로 전환 지도"
    />
  </div>
  <div class="footer">
    <div class="chips">
      <span>HTTP 403 · 독립 감사 대조</span><span>원본 격리 확인</span
      ><span>Green 응답 · 시험 경로 전환</span>
    </div>
    <div class="note">
      동일 온프렘 클러스터의 전용 무상태 시험앱<br />AWS→온프렘 이전 · 운영 T10
      완료와 별도
    </div>
  </div>
</html>
