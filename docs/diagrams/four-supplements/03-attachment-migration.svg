<text x="98" y="369" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">기존 업무 데이터 · 단일 writer</text>
<text x="98" y="395" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">정확한 복제 경로에 barrier 기록</text>
