<text x="982" y="539" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">목적지 객체 참조 · 버전 별도 기록</text>
<text x="982" y="565" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">객체 복사·최종 변경·DB 참조 대조</text>
<text x="982" y="591" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">새 첨부·교체·삭제도 역방향 반영</text>
