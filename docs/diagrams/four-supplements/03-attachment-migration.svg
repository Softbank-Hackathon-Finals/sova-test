<g font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect width="1600" height="1000" fill="white"/>
<text x="48" y="64" fill="#0f172a" font-size="37" text-anchor="start" font-weight="700">첨부파일 이전·복구: DB 참조와 객체를 함께 검증</text>
<text x="48" y="105" fill="#64748b" font-size="20" text-anchor="start" font-weight="400">기존 저장소 설정 변경에 추가: 실제 객체 복사 · 변경 추적 · 최종 정합성 · 신규 첨부의 역방향 복구</text>
