<text x="98" y="565" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">크기 · 전체 내용 checksum · 변경 경계</text>
<text x="98" y="591" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">확정 · 교체 · 삭제 · 진행 중 업로드</text>
<rect x="960" y="475" width="564" height="140" rx="12" fill="white" stroke="#cbd0dc" stroke-width="1.4"/>
