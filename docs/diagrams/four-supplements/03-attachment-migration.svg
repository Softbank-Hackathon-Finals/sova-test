<text x="800.0" y="788" fill="#0f172a" font-size="22" text-anchor="middle" font-weight="700">추가 계약 · DB·객체의 일관된 전환과 복구</text>
<text x="800.0" y="819" fill="#64748b" font-size="18" text-anchor="middle" font-weight="400">객체 저장·DB 확정은 별개 · 의도/이벤트 원장으로 조정</text>
<text x="800.0" y="845" fill="#64748b" font-size="18" text-anchor="middle" font-weight="400">쓰기 제한 → 모든 writer 봉쇄 → 최종 경계 → DB·객체 대조</text>
<text x="800.0" y="871" fill="#64748b" font-size="18" text-anchor="middle" font-weight="400">역방향 복구 준비 확인 → 목적지 writer·경로 전환 → 신규 업무 검증</text>
<text x="800.0" y="897" fill="#64748b" font-size="18" text-anchor="middle" font-weight="400">결과 불명확: SAFE_HOLD · 무손실 복구가 불가능하면 자동 복귀 금지</text>
<rect x="700.0" y="324" width="200" height="29" fill="white" rx="4"/>
<text x="800" y="344" fill="#079447" font-size="18" text-anchor="middle" font-weight="700">논리 복제 · barrier</text>
<rect x="691.0" y="494" width="218" height="29" fill="white" rx="4"/>
<text x="800" y="514" fill="#079447" font-size="18" text-anchor="middle" font-weight="700">객체 복사 · 변경 추적</text>
<text x="358" y="649" fill="#64748b" font-size="18" text-anchor="middle" font-weight="400">전환 전: 원본 일반 쓰기 봉쇄 · 진행 작업 배출</text>
<text x="1242" y="649" fill="#64748b" font-size="18" text-anchor="middle" font-weight="400">전환 후: 신규 쓰기·첨부까지 역방향 복구 대상</text>
<text x="800" y="725" fill="#f97316" font-size="19" text-anchor="middle" font-weight="700">되돌리기 = 목적지 봉쇄 + 역방향 동기화 + 최종 대조 + 출발지 복원</text>
