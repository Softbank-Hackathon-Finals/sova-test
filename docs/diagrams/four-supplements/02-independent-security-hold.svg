<text x="625" y="553" fill="#0f172a" font-size="22" text-anchor="start" font-weight="700">보류 범위 · 제한 동작</text>
<text x="625" y="584" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">조직 · 앱 · 환경 · 실제 자원</text>
<text x="625" y="610" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">사고 근거 · 허용된 긴급 대응</text>
<text x="625" y="636" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">관측·감사·복구 정보는 유지</text>
