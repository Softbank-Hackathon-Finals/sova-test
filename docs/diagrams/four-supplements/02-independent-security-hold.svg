<text x="625" y="364" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">ACTIVE / RELEASED · 별도 revision</text>
<text x="625" y="390" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">일반 승인으로 변경할 수 없음</text>
