<g font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect width="1600" height="1000" fill="white"/>
<text x="48" y="64" fill="#0f172a" font-size="37" text-anchor="start" font-weight="700">독립 보안 보류: 일반 승인과 해제 권한 분리</text>
<text x="48" y="105" fill="#64748b" font-size="20" text-anchor="start" font-weight="400">기존 전환 게이트에 추가: 새 승인·재검증 성공·검토 기한 만료만으로 보류를 해제하지 않는다.</text>
