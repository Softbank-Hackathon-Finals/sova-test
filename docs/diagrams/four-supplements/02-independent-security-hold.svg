<text x="72" y="224" fill="#0f172a" font-size="24" text-anchor="start" font-weight="700">일반 변경 · 승인</text>
<text x="72" y="253" fill="#64748b" font-size="17" text-anchor="start" font-weight="400">현재 보류를 우회할 수 없는 일반 실행</text>
<rect x="575" y="185" width="450" height="745" rx="17" fill="#fbfcfe" stroke="#ef2929" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="599" y="224" fill="#0f172a" font-size="24" text-anchor="start" font-weight="700">독립 보안 보류</text>
<text x="599" y="253" fill="#64748b" font-size="17" text-anchor="start" font-weight="400">계획 취소·재승인과 별도로 유지</text>
<rect x="1092" y="185" width="460" height="745" rx="17" fill="#fbfcfe" stroke="#909bb0" stroke-width="1.5" stroke-dasharray="6 5"/>
