<rect x="76" y="300" width="394" height="110" rx="12" fill="white" stroke="#cbd0dc" stroke-width="1.4"/>
<text x="98" y="333" fill="#0f172a" font-size="22" text-anchor="start" font-weight="700">변경 계획 · 일반 승인</text>
<text x="98" y="364" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">정확한 버전·범위에 대한 승인</text>
