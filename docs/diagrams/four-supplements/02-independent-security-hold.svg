<text x="625" y="783" fill="#0f172a" font-size="22" text-anchor="start" font-weight="700">검토 기한 ≠ 자동 해제</text>
<text x="625" y="814" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">기한 경과 시 담당자 알림</text>
<text x="625" y="840" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">보류는 해제 조건 충족까지 유지</text>
<rect x="1120" y="300" width="404" height="110" rx="12" fill="white" stroke="#cbd0dc" stroke-width="1.4"/>
<text x="1142" y="333" fill="#0f172a" font-size="22" text-anchor="start" font-weight="700">① 보류 해제 요청</text>
<text x="1142" y="364" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">인증된 요청자 · 해제 사유</text>
<text x="1142" y="390" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">원래 보류 ID · revision 결합</text>
