<text x="1142" y="508" fill="#0f172a" font-size="22" text-anchor="start" font-weight="700">② 독립 재검증</text>
<text x="1142" y="539" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">지정한 해제 조건과 현재 상태</text>
<text x="1142" y="565" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">발행자·범위·시각·유효성 확인</text>
<rect x="1120" y="650" width="404" height="125" rx="12" fill="white" stroke="#f97316" stroke-width="1.8"/>
<text x="1142" y="683" fill="#0f172a" font-size="22" text-anchor="start" font-weight="700">③ 별도 승인 · 원자적 해제</text>
<text x="1142" y="714" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">서로 다른 인증 주체 · 해제 권한</text>
<text x="1142" y="740" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">현재 revision·새 관련 사고 재확인</text>
<text x="1142" y="766" fill="#64748b" font-size="18" text-anchor="start" font-weight="400">검사와 상태 변경을 CAS로 확정</text>
<rect x="402.0" y="440" width="236" height="29" fill="white" rx="4"/>
<text x="520" y="460" fill="#ef2929" font-size="18" text-anchor="middle" font-weight="700">ACTIVE → 충돌 변경 차단</text>
<rect x="1009.5" y="435" width="101" height="29" fill="white" rx="4"/>
<text x="1060" y="455" fill="#079447" font-size="18" text-anchor="middle" font-weight="700">해제 확정</text>
<text x="1322" y="840" fill="#64748b" font-size="17" text-anchor="middle" font-weight="400">보류 revision·관련 사고 변경 시</text>
<text x="1322" y="870" fill="#64748b" font-size="17" text-anchor="middle" font-weight="400">기존 해제 승인을 재검토한다.</text>
