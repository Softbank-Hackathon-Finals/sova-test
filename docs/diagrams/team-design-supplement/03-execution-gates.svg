<polyline points="665,445 665,605" fill="none" stroke="#ef2929" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#red)" stroke-dasharray="7 6"/>
<polyline points="1030,373 1056,373" fill="none" stroke="#2457ff" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="917,445 917,605" fill="none" stroke="#ef2929" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#red)" stroke-dasharray="7 6"/>
<polyline points="1282,373 1308,373" fill="none" stroke="#2457ff" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
