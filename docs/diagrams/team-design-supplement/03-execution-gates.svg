<g font-family="Apple SD Gothic Neo,Malgun Gothic,Noto Sans KR,Arial,sans-serif"><rect width="1600" height="1000" fill="white"/>
<text x="48" y="64" fill="#0f172a" font-size="37" text-anchor="start" font-weight="700">실행 직전 검증: 승인만으로 변경하지 않는다</text>
<text x="48" y="105" fill="#64748b" font-size="20" text-anchor="start" font-weight="400">모든 조건을 현재 값으로 재검사한다. 누락·만료·불일치는 변경 허가가 아니다.</text>
<path d="M1290 32H1344" stroke="#2457ff" stroke-width="2.5" fill="none" marker-end="url(#blue)"/>
<text x="1360" y="38" fill="#0f172a" font-size="17" text-anchor="start" font-weight="400">요청 · 제어 흐름</text>
<path d="M1290 61H1344" stroke="#079447" stroke-width="2.5" fill="none" marker-end="url(#green)"/>
<text x="1360" y="67" fill="#0f172a" font-size="17" text-anchor="start" font-weight="400">데이터 · 실제 관측</text>
<path d="M1290 90H1344" stroke="#ef2929" stroke-width="2.5" fill="none" marker-end="url(#red)" stroke-dasharray="7 6"/>
<text x="1360" y="96" fill="#0f172a" font-size="17" text-anchor="start" font-weight="400">차단 · 검증 경계</text>
<rect x="1290" y="109" width="54" height="24" rx="5" fill="white" stroke="#f97316" stroke-width="1.7"/>
<text x="1360" y="127" fill="#0f172a" font-size="17" text-anchor="start" font-weight="400">직접 구현 · 판단</text>
<text x="48" y="976" fill="#64748b" font-size="15" text-anchor="start" font-weight="400">설계 보충안 · 목표 구조이며 구현 완료를 의미하지 않음</text>
<polyline points="274,373 300,373" fill="none" stroke="#2457ff" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#blue)"/>
<polyline points="161,445 161,605" fill="none" stroke="#ef2929" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#red)" stroke-dasharray="7 6"/>
