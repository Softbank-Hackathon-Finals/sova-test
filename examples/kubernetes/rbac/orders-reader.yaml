# Review before applying. Dedicated tenant namespace required.
# Label selectors are NOT an RBAC authorization boundary.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sova-inventory-reader
  namespace: orders
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sova-inventory-reader
  namespace: orders
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [list]
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sova-inventory-reader
  namespace: orders
subjects:
  - kind: ServiceAccount
    name: sova-inventory-reader
    namespace: orders
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sova-inventory-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sova-orders-namespace-identity-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [orders]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sova-orders-namespace-identity-reader
subjects:
  - kind: ServiceAccount
    name: sova-inventory-reader
    namespace: orders
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sova-orders-namespace-identity-reader
