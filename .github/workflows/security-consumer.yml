name: security-consumer
on:
  pull_request:
  push:
    branches: [main, feature/security-service-integration]
permissions:
  contents: read
jobs:
  patch-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: 'never'
      SECURITY_COMMIT: b3cbbe62cfdc2f762a4c223d13bb24c88963d620
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the pinned security producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Softbank-Hackathon-Finals/security
          ref: ${{ env.SECURITY_COMMIT }}
          path: .local-notes/security-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Install the producer's locked qualification dependencies
        working-directory: .local-notes/security-source
        run: uv sync --locked --extra dev --no-install-project --no-build --python '3.12'
      - name: Build and install the pinned wheel and consumer without package index fallback
        run: |
          PYTHON="$PWD/.local-notes/security-source/.venv/bin/python"
          "$PYTHON" -m pip wheel .local-notes/security-source --no-deps --no-build-isolation --no-index -w "$RUNNER_TEMP/security-dist"
          "$PYTHON" -m pip install --no-deps --no-index "$RUNNER_TEMP/security-dist/"*.whl
          "$PYTHON" -m pip install --no-deps --no-build-isolation --no-index -e .
          "$PYTHON" -m pip check
      - name: Verify the package and current execution boundaries
        run: |
          PYTHON="$PWD/.local-notes/security-source/.venv/bin/python"
          "$PYTHON" -c "from importlib.metadata import version; assert version('sova-security') == '0.11.0'"
          "$PYTHON" -m pytest tests/integration/test_security_patch_execution.py -q
