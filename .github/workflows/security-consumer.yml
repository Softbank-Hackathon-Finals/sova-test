name: security-consumer
on:
  pull_request:
  push:
    branches: [main, feature/security-service-integration]
permissions:
  contents: read
jobs:
  patch-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        runtime: [process, container]
    services:
      security-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bravo_test_admin
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: sova_security_test
          POSTGRES_INITDB_ARGS: '-c cluster_name=sova-security-test'
        volumes: ['/tmp/security-consumer-pg:/var/run/postgresql']
        options: >-
          --health-cmd "pg_isready -U bravo_test_admin -d sova_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      sova-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bravo_test_admin
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: sova_test
          POSTGRES_INITDB_ARGS: '-c cluster_name=sova-persistence-test'
        volumes: ['/tmp/sova-consumer-pg:/var/run/postgresql']
        options: >-
          --health-cmd "pg_isready -U bravo_test_admin -d sova_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UV_PYTHON_DOWNLOADS: 'never'
      SECURITY_COMMIT: 269e1e509245bd5bb1cd62a753f7b3ef5e860992
      SOVA_SECURITY_TEST_SOURCE: '${{ github.workspace }}/.local-notes/security-source'
      SOVA_SECURITY_TEST_POSTGRES_DSN: 'host=/tmp/security-consumer-pg port=5432 user=bravo_test_admin password=ci-test-only dbname=sova_security_test'
      SOVA_TEST_POSTGRES_DSN: 'host=/tmp/sova-consumer-pg port=5432 user=bravo_test_admin password=ci-test-only dbname=sova_test'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read the pinned security producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Softbank-Hackathon-Finals/security
          ref: ${{ env.SECURITY_COMMIT }}
          path: .local-notes/security-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Install the producer's locked qualification dependencies
        working-directory: .local-notes/security-source
        run: uv sync --locked --extra dev --no-install-project --no-build --python '3.12'
      - name: Build and install the pinned wheel and consumer without package index fallback
        run: |
          PYTHON="$PWD/.local-notes/security-source/.venv/bin/python"
          "$PYTHON" -m pip wheel .local-notes/security-source --no-deps --no-build-isolation --no-index -w "$RUNNER_TEMP/security-dist"
          "$PYTHON" -m pip install --no-deps --no-index "$RUNNER_TEMP/security-dist/"*.whl
          "$PYTHON" -m pip install --no-deps --no-build-isolation --no-index -e .
          "$PYTHON" -m pip check
      - name: Verify the package and current execution boundaries
        run: |
          PYTHON="$PWD/.local-notes/security-source/.venv/bin/python"
          "$PYTHON" -c "from importlib.metadata import version; assert version('sova-security') == '0.11.0'"
      - name: Build the exact producer service image for container mode
        if: matrix.runtime == 'container'
        run: |
          PYTHON="$PWD/.local-notes/security-source/.venv/bin/python"
          "$PYTHON" .local-notes/security-source/scripts/prepare_service_image.py \
            --project .local-notes/security-source --output "$RUNNER_TEMP/security-image-context"
          docker build --platform linux/amd64 --iidfile "$RUNNER_TEMP/security-image-id" \
            --label "org.opencontainers.image.revision=$SECURITY_COMMIT" "$RUNNER_TEMP/security-image-context"
          echo "SOVA_TEST_REVIEW_IMAGE=$(cat "$RUNNER_TEMP/security-image-id")" >> "$GITHUB_ENV"
          echo "SOVA_TEST_REVIEW_IMAGE_COMMIT=$SECURITY_COMMIT" >> "$GITHUB_ENV"
      - name: Verify execution, failure and response-loss boundaries
        run: |
          PYTHON="$PWD/.local-notes/security-source/.venv/bin/python"
          "$PYTHON" -m pytest tests/integration/test_security_patch_execution.py tests/integration/test_security_review_runtime.py -q
